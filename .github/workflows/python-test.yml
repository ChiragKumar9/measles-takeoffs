name: Python Test

# Runs on every push (any branch) and on every pull request
on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Only the `test` dependency group (pytest, numpy, polars, addfips), not
      # the whole project: the tests use no data files and no model code.
      - name: run the tests
        run: uv run --locked --only-group test pytest -q
