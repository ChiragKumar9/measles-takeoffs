name: pre-commit

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: 3.12
    # pre-commit/action caches ~/.cache/pre-commit itself. No R, Java or Rust
    # setup: those hooks are off in .pre-commit-config.yaml (no such code here)
    - uses: pre-commit/action@v3.0.1
