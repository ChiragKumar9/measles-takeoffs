[project]
name = "outbreak-size"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Chirag Kumar (@ChiragKumar9)", email = "chirag9kumar@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "census>=0.8.24",
    "fastexcel>=0.16.0",
    "ipython>=9.5.0",
    "matplotlib>=3.10.6",
    "polars>=1.33.1",
    "pyarrow>=21.0.0",
    "pyqt6>=6.9.1",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "statsmodels>=0.14.5",
    "tqdm>=4.67.1",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
test = [
    "pytest>=8.4.2",
]

[tool.ruff]
fix = true
line-length = 79

[tool.ruff.lint]
select = ["I"]
